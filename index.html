<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080d">
<title>PROJECT STAGE ☆ 計算オーディション</title>
<style>
:root{
  --bg:#0a0a11; --bg2:#111119; --card:#15151f; --card2:#1d1d29; --line:#2e2e40;
  --ink:#f5f5fa; --ink2:#a5a5bd; --ink3:#71718c;
  --red:#ff4d63; --redD:#c22a42; --gold:#e9e9f4; --goldD:#b9b9cc;
  --cyan:#5ac8fa; --green:#4ad6b8; --purple:#a06bf0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);font-weight:700;letter-spacing:.01em;
}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;color:inherit}
input{font-family:inherit;font-weight:800}

/* ===== bg ===== */
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:radial-gradient(80% 50% at 50% -10%,#241a3a 0%,#0d0d16 55%,#08080d 100%)}
.beam{position:absolute;width:60vw;height:60vw;border-radius:50%;pointer-events:none;
  filter:blur(70px);opacity:.16;animation:float 16s ease-in-out infinite}
.beam:first-child{background:radial-gradient(circle,#5ac8fa,#a06bf0 70%);top:-10%}
.beam:last-child{background:radial-gradient(circle,#ff8ad8,#4ad6b8 70%);bottom:-15%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vh) scale(1.15)}}

/* ===== screens ===== */
.scr{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.scr.on{display:flex}
.hide{display:none!important}

/* ===== parts ===== */
.btn{background:linear-gradient(180deg,#ffffff,#d9d9e6);color:#0a0a11;border-radius:12px;
  padding:15px 18px;font-size:15px;width:100%;letter-spacing:.1em;
  box-shadow:0 0 0 1px #ffffff22 inset,0 8px 26px #ffffff1c}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:#ffffff0a;color:var(--ink);border-radius:12px;box-shadow:0 0 0 1px #ffffff26 inset;backdrop-filter:blur(8px)}
.btn.gold{background:linear-gradient(120deg,#e8e8f2,#ffffff 45%,#c9c9dd);color:#0a0a11;border-radius:12px;box-shadow:0 6px 22px #ffffff26}
.btn.dark{background:#ffffff07;color:var(--ink2);border-radius:12px;box-shadow:0 0 0 1px #ffffff1a inset}
.btn.sm{font-size:11.5px;padding:11px 4px;letter-spacing:.02em}
.btn:disabled{opacity:.35;pointer-events:none}
.card{background:#ffffff08;border-radius:16px;padding:12px;box-shadow:0 0 0 1px #ffffff14 inset;backdrop-filter:blur(10px)}
.lbl{font-size:10px;letter-spacing:.24em;color:var(--ink3)}

/* ===== title ===== */
#scrTitle{align-items:center;justify-content:center;padding:20px}
.tWrap{text-align:center;width:100%;max-width:420px;position:relative;z-index:2}
.tSub{font-size:11px;letter-spacing:.5em;color:#ffffff88;margin-bottom:16px;text-transform:lowercase}
.logo{font-size:min(12vw,46px);line-height:1.15;font-weight:200;letter-spacing:.3em;
  text-transform:lowercase;font-family:"Helvetica Neue","Hiragino Sans",sans-serif;
  background:linear-gradient(100deg,#8f8fa8 0%,#ffffff 30%,#c9c9dd 50%,#ffffff 72%,#8f8fa8 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px #ffffff30);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.logo em{display:block;font-style:normal;font-size:.4em;letter-spacing:.42em;font-weight:300;
  background:linear-gradient(90deg,#9a9ab5,#ffffff,#9a9ab5);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-top:12px}
.tLine{margin:18px auto 0;width:90px;height:1px;background:linear-gradient(90deg,transparent,#ffffffbb,transparent)}
.tCatch{margin-top:14px;font-size:12.5px;color:var(--ink2);line-height:1.9}
.tCatch b{color:var(--ink);font-size:15px}
.tBtns{margin-top:24px;display:flex;flex-direction:column;gap:9px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dpLine{margin-top:14px;font-size:11px;color:var(--ink3);letter-spacing:.06em}
.dpLine b{color:var(--gold)}
#muteBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:60;
  background:#ffffff0d;border-radius:6px;padding:7px 10px;font-size:14px;box-shadow:0 0 0 1px var(--line) inset}

/* ===== create ===== */
#scrCreate{overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));z-index:2}
.secT{font-size:10px;letter-spacing:.24em;color:var(--gold);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.secT::after{content:"";flex:1;height:1px;background:var(--line)}
#nameIn{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px;
  font-size:18px;text-align:center;color:var(--ink);outline:none}
#nameIn:focus{border-color:var(--red)}
.pickRow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pk{width:64px;height:78px;border-radius:6px;overflow:hidden;padding:0;
  box-shadow:0 0 0 1px var(--line) inset;filter:grayscale(.6) brightness(.7);transition:.15s}
.pk.on{filter:none;box-shadow:0 0 0 2px var(--gold) inset,0 0 18px #ffcf5c40;transform:translateY(-3px)}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.typeRow{display:grid;gap:7px}
.tp{background:var(--card);border-radius:6px;padding:11px 12px;text-align:left;
  display:flex;gap:10px;align-items:center;box-shadow:0 0 0 1px var(--line) inset}
.tp.on{box-shadow:0 0 0 1px var(--red) inset;background:#25151b}
.tp .tpe{font-size:22px}
.tp b{font-size:13.5px;display:block}
.tp small{font-size:10.5px;color:var(--ink2);font-weight:700}

/* ===== main ===== */
#mHead{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:center;z-index:2}
#mHead .day{font-size:10px;letter-spacing:.2em;color:var(--ink3)}
#mHead .day b{font-size:26px;color:var(--ink);letter-spacing:0;margin:0 3px}
#mHead .nx{font-size:10.5px;text-align:right;line-height:1.5}
#mHead .nx b{color:var(--gold)}
#mHead .camp{display:inline-block;font-size:9px;letter-spacing:.14em;background:var(--red);color:#fff;padding:2px 7px;border-radius:3px;margin-top:3px}
#mBody{flex:1;overflow-y:auto;padding:2px 14px 8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.meCard{display:flex;gap:11px;align-items:center;padding:10px}
.meAv{width:60px;height:72px;border-radius:5px;overflow:hidden;flex:0 0 auto;position:relative;box-shadow:0 0 0 1px var(--line)}
.meAv img{width:100%;height:100%;object-fit:cover}
.meAv i{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:16px}
.meInfo{flex:1;min-width:0}
.meInfo .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.meInfo .nm b{font-size:17px}
.meInfo .nm span{font-size:9px;letter-spacing:.1em;color:var(--gold);border:1px solid #ffcf5c55;padding:1px 6px;border-radius:3px}
.gauge{height:6px;background:#ffffff12;border-radius:2px;overflow:hidden;flex:1}
.gauge u{display:block;height:100%;transition:width .4s;text-decoration:none}
.mini{display:flex;align-items:center;gap:7px;font-size:10px;margin-top:6px;color:var(--ink2)}
.mini b{font-size:11px;color:var(--ink);min-width:26px;text-align:right}
.condTag{font-size:10px;padding:1px 7px;border-radius:3px;color:#08080d;font-weight:900}
.fansL{font-size:10px;color:var(--cyan)}
.fansL b{font-size:13px}
.warnTag{display:block;margin-top:6px;font-size:10px;color:var(--red);letter-spacing:.08em}

.statCard{padding:11px 12px}
.strow{display:flex;align-items:center;gap:8px;margin:6px 0}
.strow .sn{font-size:10.5px;width:56px;flex:0 0 auto;color:var(--ink2);white-space:nowrap}
.strow .sv{font-size:11px;width:26px;text-align:right;color:var(--ink)}
.rk{font-size:11px;font-weight:900;width:19px;text-align:center;border-radius:2px;color:#08080d;padding:1px 0}

.cmdGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cmd{background:#ffffff08;border-radius:14px;padding:11px 10px;text-align:left;display:flex;gap:9px;
  align-items:center;box-shadow:0 0 0 1px var(--line) inset}
.cmd:active{background:var(--card2);transform:translateY(1px)}
.cmd .ce{font-size:21px;flex:0 0 auto}
.cmd b{font-size:12.5px;display:block;line-height:1.3}
.cmd small{font-size:9px;color:var(--ink3);font-weight:700;display:block}
.cmd .cost{font-size:9px;color:var(--ink3)}
.cmd.wide{grid-column:span 2}
.cmd.rest{background:#111b22}
.cmd.talk{background:#1a1526}
.cmd.team{background:#241a12;box-shadow:0 0 0 1px #ffcf5c44 inset}
.cmd.aud{background:linear-gradient(100deg,#3a1018,#1a0a10);box-shadow:0 0 0 1px var(--red) inset;
  animation:pulseR 1.8s ease-in-out infinite}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 1px var(--red) inset,0 0 0 #e6394600}50%{box-shadow:0 0 0 1px var(--red) inset,0 0 22px #e6394655}}

.charRow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:0 0 auto;width:58px;text-align:center;background:var(--card);border-radius:5px;padding:4px;
  box-shadow:0 0 0 1px var(--line) inset}
.chip img{width:100%;height:50px;object-fit:cover;border-radius:3px;display:block}
.chip.out img{filter:grayscale(1) brightness(.45)}
.chip .cn{font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .hb{height:3px;background:#ffffff14;border-radius:2px;margin-top:3px;overflow:hidden}
.chip .hb u{display:block;height:100%;text-decoration:none}
.chip .outT{font-size:8px;color:var(--red);letter-spacing:.1em}
#mFoot{display:flex;gap:6px;padding:7px 14px calc(9px + env(safe-area-inset-bottom));z-index:2;
  border-top:1px solid var(--line);background:#0b0b12}
.fb{flex:1;background:#ffffff08;border-radius:5px;padding:9px 2px;font-size:10px;color:var(--ink2)}
.fb:active{background:#ffffff16}

/* ===== quiz ===== */
#scrQuiz{background:linear-gradient(180deg,#0d0d16,#08080d)}
#scrQuiz.stage{background:radial-gradient(90% 55% at 50% -8%,#4a1220 0%,#180a12 45%,#08080d 100%)}
#qHead{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 5px;z-index:2}
.qg{font-size:11.5px;letter-spacing:.08em}
.qprog{font-size:11px;color:var(--ink3)}
.qprog b{font-size:19px;color:var(--gold)}
#qCombo{font-size:12px;color:var(--red);min-width:66px;text-align:right;font-weight:900;letter-spacing:.04em}
#qCombo.hot{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#qTimerWrap{height:3px;background:#ffffff12;margin:3px 14px 0;overflow:hidden;z-index:2}
#qTimer{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .12s linear}
#qTimer.warn{background:linear-gradient(90deg,#ff9f43,var(--red))}
#qJudges{display:flex;justify-content:center;gap:12px;padding:8px 0 0;z-index:2}
.jd{text-align:center;width:62px}
.jd img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;
  box-shadow:0 0 0 2px #ffffff20;filter:grayscale(.5);transition:.25s}
.jd.good img{filter:none;box-shadow:0 0 0 2px var(--gold),0 0 16px #ffcf5c55}
.jd .jn{font-size:8.5px;color:var(--ink3);margin-top:3px}
.jd .jb{width:44px;height:3px;background:#ffffff14;border-radius:2px;margin:3px auto 0;overflow:hidden}
.jd .jb u{display:block;height:100%;background:linear-gradient(90deg,#ffdd85,var(--gold));text-decoration:none;transition:width .3s}
#qMid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:6px 14px;min-height:0;z-index:2}
#qArea{background:#ffffff0a;backdrop-filter:blur(10px);border-radius:18px;padding:15px 12px;text-align:center;
  box-shadow:0 0 0 1px var(--line) inset,0 10px 30px #00000060}
#qTag{font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:9px}
#qText{font-size:clamp(21px,7vw,32px);line-height:1.45;font-weight:900}
#qText.small{font-size:clamp(15px,4.6vw,21px);line-height:1.65}
#qNote{font-size:10.5px;color:var(--ink3);margin-top:7px;font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1;margin:0 3px;transform:translateY(-2px)}
.fr i{font-style:normal;border-bottom:2.5px solid currentColor;padding:0 5px 2px}
.fr b{padding:2px 5px 0}
#qInput{background:#00000080;border-radius:14px;padding:11px 14px;font-size:26px;text-align:center;
  min-height:52px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px var(--line) inset;color:var(--gold)}
#qInput.ok{box-shadow:0 0 0 1.5px var(--green) inset}
#qInput.ng{box-shadow:0 0 0 1.5px var(--red) inset;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#qInput em{font-style:normal;font-size:14px;color:var(--ink3);margin-left:4px}
.caret{display:inline-block;width:2px;height:26px;background:var(--gold);animation:bl .9s steps(2) infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 14px calc(11px + env(safe-area-inset-bottom));z-index:2}
.key{background:#ffffff0a;border-radius:12px;padding:14px 0;font-size:21px;color:var(--ink);
  box-shadow:0 0 0 1px var(--line) inset}
.key:active{background:var(--card2)}
.key.fn{background:#ffffff08;font-size:16px;color:var(--ink2)}
.key.ok{background:linear-gradient(180deg,#ffffff,#d9d9e6);color:#0a0a11;font-size:17px;box-shadow:none}
.key.w2{grid-column:span 2}
#qFb{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;pointer-events:none;z-index:40;padding-bottom:36vh}
#qFb.on{display:flex}
#qFb .fbi{font-size:min(16vw,66px);font-weight:900;letter-spacing:.03em;text-align:center;line-height:1.15;
  animation:fbin .45s;text-shadow:0 0 30px currentColor}
#qFb .fbi small{display:block;font-size:14px;color:var(--ink);text-shadow:none;background:#000000cc;
  box-shadow:0 0 0 1px var(--line) inset;border-radius:4px;padding:5px 14px;margin-top:10px;letter-spacing:0}
@keyframes fbin{0%{transform:scale(.5);opacity:0}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* ===== announce (合格発表) ===== */
#scrAnn{background:#05050a;align-items:center;justify-content:center;padding:22px;text-align:center}
.annWrap{width:100%;max-width:420px;z-index:2}
.annTitle{font-size:11px;letter-spacing:.36em;color:var(--gold)}
.annSub{font-size:13px;color:var(--ink2);margin-top:14px;line-height:2;min-height:56px}
.annList{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.annRow{display:flex;align-items:center;gap:11px;background:#ffffff08;border-radius:14px;padding:9px 12px;
  box-shadow:0 0 0 1px var(--line) inset;opacity:0;transform:translateY(10px)}
.annRow.in{animation:annin .5s forwards}
@keyframes annin{to{opacity:1;transform:translateY(0)}}
.annRow img{width:40px;height:40px;border-radius:4px;object-fit:cover}
.annRow .an{flex:1;text-align:left;font-size:15px}
.annRow .ax{font-size:11px;letter-spacing:.16em}
.annRow.pass{box-shadow:0 0 0 1px #ffcf5c66 inset;background:#171205}
.annRow.pass .ax{color:var(--gold)}
.annRow.me{box-shadow:0 0 0 1.5px var(--gold) inset;background:#1d1607}
.annRow.out{opacity:.5}
.annRow.out img{filter:grayscale(1) brightness(.5)}
.annRow.out .ax{color:var(--red)}
#annBtn{margin-top:22px}

/* ===== overlay ===== */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#000000b0}
.ov.on{display:flex}
.ov.mid{align-items:center;padding:12px}
.panel{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:#15151fF2;backdrop-filter:blur(16px);
  border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  animation:rise .26s;box-shadow:0 0 0 1px var(--line) inset}
.ov.mid .panel{border-radius:20px;padding-bottom:18px}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.ptitle{text-align:center;font-size:15px;font-weight:900;margin-bottom:12px;letter-spacing:.06em}
.ptitle small{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px;letter-spacing:0}
.tabs{display:flex;gap:5px;margin-bottom:11px}
.tab{flex:1;background:#ffffff08;border-radius:10px;padding:8px 2px;font-size:10.5px;color:var(--ink3)}
.tab.on{background:#ffffff;color:#0a0a11}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:#ffffff07;border-radius:12px;padding:9px 11px;display:flex;gap:10px;align-items:center;
  box-shadow:0 0 0 1px var(--line) inset;width:100%;text-align:left}
.item .ie{font-size:20px;flex:0 0 auto}
.item img.ii{width:38px;height:38px;border-radius:4px;object-fit:cover;flex:0 0 auto}
.item .it{flex:1;min-width:0}
.item b{font-size:12.5px;display:block}
.item small{font-size:10px;color:var(--ink3);font-weight:700;display:block;line-height:1.6}
.item.lock{opacity:.4}
.item .buy{background:var(--gold);color:#1a1200;border-radius:4px;padding:7px 11px;font-size:10.5px;flex:0 0 auto}
.item .buy:disabled{opacity:.35}
.item .own{font-size:10px;color:var(--green)}

/* result */
.resHead{text-align:center;margin-bottom:10px}
.resScore{font-size:46px;font-weight:900;line-height:1;color:var(--gold)}
.resScore small{font-size:13px;color:var(--ink3)}
.resRank{display:inline-block;font-size:11.5px;letter-spacing:.14em;padding:4px 14px;border-radius:3px;margin-top:7px;color:#08080d}
.gains{display:flex;flex-direction:column;gap:5px;margin:11px 0}
.gain{display:flex;justify-content:space-between;background:#ffffff07;border-radius:10px;padding:8px 12px;font-size:12.5px}
.gain b{color:var(--green)}
.judgeRow{display:flex;gap:10px;align-items:center;background:#ffffff07;border-radius:14px;padding:9px;margin-bottom:6px}
.judgeRow img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.judgeRow .jt{flex:1;min-width:0}
.judgeRow .jt b{font-size:11.5px;display:block;color:var(--gold)}
.judgeRow .jt small{font-size:11px;color:var(--ink2);font-weight:700;line-height:1.6;display:block}
.judgeRow .js{font-size:20px;font-weight:900;flex:0 0 auto}
.missBox{background:#ffffff07;border-radius:12px;padding:10px;margin:9px 0}
.missBox .mt{font-size:10px;letter-spacing:.14em;color:var(--red);margin-bottom:6px}
.missRow{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.missRow:last-child{border:none}
.missRow em{font-style:normal;color:var(--gold);font-weight:900}

/* event */
.evTop{display:flex;align-items:flex-end;gap:10px;padding-left:4px;margin-bottom:-4px}
.evTop img{width:88px;height:104px;object-fit:cover;border-radius:6px;box-shadow:0 8px 26px #000000aa}
.evName{background:#0e0e16;color:var(--gold);font-size:11px;letter-spacing:.1em;
  padding:4px 12px;border-radius:3px;box-shadow:0 0 0 1px var(--line) inset;margin-bottom:10px}
.evBody{background:#14141ef0;backdrop-filter:blur(12px);border-radius:16px;padding:14px;font-size:13.5px;line-height:1.95;
  box-shadow:0 0 0 1px var(--line) inset;min-height:78px}
.evChoices{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.evc{background:#ffffff0a;border-radius:12px;padding:11px;font-size:12.5px;text-align:left;
  box-shadow:0 0 0 1px var(--line) inset}
.evc:active{box-shadow:0 0 0 1px var(--gold) inset}

/* skill flash */
#skillFlash{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#000000e0}
#skillFlash.on{display:flex}
.sfBox{text-align:center;animation:sfin .5s;padding:0 20px}
@keyframes sfin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sfLabel{font-size:10px;letter-spacing:.34em;color:var(--gold)}
.sfName{font-size:min(8.5vw,32px);font-weight:900;color:#fff;margin:12px 0;text-shadow:0 0 24px var(--gold)}
.sfDesc{font-size:12px;color:var(--ink2);line-height:1.9}
.sfStar{font-size:34px}

/* ending */
#scrEnd{background:radial-gradient(80% 50% at 50% 0%,#3a2a08 0%,#140d16 45%,#05050a 100%);
  overflow-y:auto;padding:calc(22px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}
.endCard{max-width:460px;margin:0 auto;text-align:center}
.endRank{font-size:min(26vw,104px);font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff,#ffcf5c 45%,#a8791a);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 0 26px #ffcf5c55)}
.endTitle{font-size:19px;font-weight:900;color:var(--gold);margin:6px 0 12px;letter-spacing:.06em}
.endText{font-size:13px;line-height:2;text-align:left;background:#0e0e16;border-radius:8px;padding:14px;
  box-shadow:0 0 0 1px var(--line) inset;color:var(--ink)}
.endStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;font-size:11.5px}
.endStats div{background:var(--card);border-radius:5px;padding:8px;box-shadow:0 0 0 1px var(--line) inset}
.dpGet{font-size:13px;color:var(--gold);margin:12px 0}
.dpGet b{font-size:26px}

/* toast / confetti */
#toast{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:100%;padding:0 14px}
.tst{background:#0e0e16;color:var(--ink);font-size:12px;padding:8px 16px;border-radius:4px;
  box-shadow:0 0 0 1px var(--line) inset,0 6px 18px #000000aa;animation:tin .3s;max-width:100%}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
.conf{position:fixed;top:-30px;font-size:18px;z-index:75;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(520deg);opacity:.15}}
.conf2{position:fixed;top:-24px;z-index:75;pointer-events:none;border-radius:2px;
  animation:cf2 linear forwards}
@keyframes cf2{
  0%{transform:translateY(0) rotate(0) skewX(0deg)}
  100%{transform:translateY(112vh) rotate(var(--rz)) skewX(18deg);opacity:.25}
}

.smallnote{font-size:10px;color:var(--ink3);text-align:center;line-height:1.8;margin-top:10px;font-weight:700}
.divider{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 2px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:3px;background:#ffffff12;color:var(--ink2);letter-spacing:.08em}

@media (max-height:700px){
  .cmd{padding:9px 8px}.cmd .ce{font-size:19px}.cmd b{font-size:11.5px}
  .meAv{width:52px;height:62px}
  .key{padding:11px 0;font-size:19px}
  #qText{font-size:clamp(19px,6.4vw,28px)}
}
</style>
</head>
<body>
<div id="bg"><div class="beam" style="left:8%"></div><div class="beam" style="left:58%;animation-delay:-4s"></div></div>
<div id="toast"></div>

<!-- ============ TITLE ============ -->
<section class="scr on" id="scrTitle">
  <div class="tWrap">
    <div class="tSub">boys audition</div>
    <h1 class="logo">project<br>stage<em>計算オーディション</em></h1>
    <div class="tLine"></div>
    <div class="tCatch"><b>20,000人の中から、5人。</b><br>合格者は「タイムレッスー」の新メンバーに。</div>
    <div class="tBtns">
      <button class="btn" id="btnNew">応募する（はじめから）</button>
      <button class="btn ghost" id="btnCont">つづきから</button>
      <div class="row3">
        <button class="btn sm dark" id="btnDrill">🔥 特訓</button>
        <button class="btn sm dark" id="btnDream">💠 強化</button>
        <button class="btn sm dark" id="btnZukanT">📁 記録</button>
      </div>
    </div>
    <div class="dpLine">💠 プロジェクトポイント <b id="tDp">0</b>　／　挑戦回数 <b id="tPlays">0</b></div>
    <button id="btnHelp" style="margin-top:12px;background:none;color:var(--ink3);font-size:11px;text-decoration:underline">ルール説明</button>
  </div>
  <button id="muteBtn">🔊</button>
</section>

<!-- ============ CREATE ============ -->
<section class="scr" id="scrCreate">
  <div class="ptitle">エントリーシート<small>ここから、すべてが始まる。</small></div>
  <div class="secT">NAME（6文字まで）</div>
  <input id="nameIn" maxlength="6" placeholder="はると" autocomplete="off">
  <div class="secT">FACE</div>
  <div class="pickRow" id="avPick"></div>
  <div class="secT">TYPE</div>
  <div class="typeRow" id="typePick"></div>
  <div style="height:16px"></div>
  <button class="btn" id="btnStart">審査会場へ向かう</button>
  <button class="btn dark" id="btnBackTitle" style="margin-top:8px">もどる</button>
  <div class="smallnote">30日間の練習と5回の審査。<br>脱落したらそこで終わり。くり返し挑戦するほど強くなれる。</div>
</section>

<!-- ============ MAIN ============ -->
<section class="scr" id="scrMain">
  <header id="mHead">
    <div class="day">DAY<b id="mDay">1</b>／30<div id="mPhase" style="font-size:9.5px;color:var(--ink3);letter-spacing:.1em"></div></div>
    <div class="nx" id="mNext"></div>
  </header>
  <div id="mBody">
    <div class="card meCard">
      <div class="meAv"><img id="mAv" src="" alt=""><i id="mOutfit"></i></div>
      <div class="meInfo">
        <div class="nm"><b id="mName"></b><span id="mTitleTag"></span></div>
        <div class="mini"><span>体力</span><div class="gauge"><u id="mStam"></u></div><b id="mStamN">100</b></div>
        <div class="mini"><span class="condTag" id="mCond"></span><span class="fansL">📈 注目度 <b id="mFans">0</b></span></div>
        <span class="warnTag hide" id="mWarn">⚠ 崖っぷち：次の審査で挽回できなければ終わり</span>
      </div>
    </div>
    <div class="card statCard" id="mStats"></div>
    <div class="cmdGrid" id="mCmds"></div>
    <div class="charRow" id="mChars"></div>
  </div>
  <footer id="mFoot">
    <button class="fb" data-a="shop">衣装</button>
    <button class="fb" data-a="skill">スキル</button>
    <button class="fb" data-a="zukan">記録</button>
    <button class="fb" data-a="quit">中断</button>
  </footer>
</section>

<!-- ============ QUIZ ============ -->
<section class="scr" id="scrQuiz">
  <div id="qHead">
    <div class="qg" id="qGenre"></div>
    <div class="qprog"><b id="qNo">1</b> / <span id="qTotal">8</span></div>
    <div id="qCombo"></div>
  </div>
  <div id="qTimerWrap"><i id="qTimer"></i></div>
  <div id="qJudges" class="hide"></div>
  <div id="qMid">
    <div id="qArea">
      <div id="qTag"></div>
      <div id="qText"></div>
      <div id="qNote"></div>
    </div>
    <div id="qInput"><span id="qVal"></span><span class="caret"></span><em id="qUnit"></em></div>
  </div>
  <div id="pad"></div>
  <div id="qFb"></div>
</section>

<!-- ============ ANNOUNCE ============ -->
<section class="scr" id="scrAnn">
  <div class="annWrap">
    <div class="annTitle" id="annTitle">合 格 者 発 表</div>
    <div class="annSub" id="annSub"></div>
    <div class="annList" id="annList"></div>
    <button class="btn hide" id="annBtn">▶</button>
  </div>
</section>

<!-- ============ ENDING ============ -->
<section class="scr" id="scrEnd"><div class="endCard" id="endCard"></div></section>

<!-- ============ OVERLAYS ============ -->
<div class="ov mid" id="ovResult"><div class="panel" id="resPanel"></div></div>
<div class="ov mid" id="ovEvent"><div class="panel" id="evPanel" style="background:transparent;box-shadow:none;padding:0"></div></div>
<div class="ov" id="ovSheet"><div class="panel" id="sheetPanel"></div></div>
<div id="skillFlash"><div class="sfBox" id="sfBox"></div></div>

<script src="math.js"></script>
<script src="game.js"></script>
</body>
</html>
